<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST | Vercel Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #000000;
            --glass: rgba(25, 25, 25, 0.7);
        }
        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .premium-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 28px;
        }
        .gold-text {
            background: linear-gradient(135deg, #d4af37 0%, #f7ef8a 50%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-main {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
        }
        /* Tab Styles */
        .tab { transition: 0.3s; color: #666; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
        .tab.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
        
        /* Mobile Smooth Scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.5s ease forwards; }
    </style>
</head>
<body class="safe-area-inset-top">

    <!-- Header Area -->
    <div class="px-6 pt-8 pb-4">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black tracking-tight gold-text">GHOST.v3</h1>
                <p class="text-[10px] text-gray-500 tracking-[3px] uppercase">Nexus Controller</p>
            </div>
            <div class="h-10 w-10 rounded-full border border-gold/20 flex items-center justify-center bg-gray-900">
                <i class="fas fa-user-shield text-xs text-gold"></i>
            </div>
        </div>
    </div>

    <!-- Main Mobile Layout -->
    <div class="px-4 pb-20 space-y-6 max-w-md mx-auto">
        
        <!-- API Token Section -->
        <div class="premium-card p-5 animate-fade">
            <label class="text-[10px] font-bold text-gray-500 uppercase mb-2 block">Vercel Authority Key</label>
            <input type="password" id="apiToken" placeholder="Paste Bearer Token" 
                class="w-full bg-black/50 border border-gray-800 rounded-xl px-4 py-3 text-sm outline-none focus:border-gold/50 transition">
        </div>

        <!-- Deployer UI -->
        <div class="premium-card p-5 animate-fade" style="animation-delay: 0.1s;">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold">Deploy Module</h2>
                <span class="text-[10px] text-gold animate-pulse" id="statusText">READY</span>
            </div>
            
            <input type="text" id="projName" placeholder="project-name" 
                class="w-full bg-black/50 border border-gray-800 rounded-xl px-4 py-3 text-sm mb-4 outline-none focus:border-gold/50">

            <div class="flex gap-4 border-b border-gray-800 mb-4">
                <button onclick="switchTab('html')" id="tab-html" class="tab active pb-2 uppercase">HTML</button>
                <button onclick="switchTab('css')" id="tab-css" class="tab pb-2 uppercase">CSS</button>
                <button onclick="switchTab('js')" id="tab-js" class="tab pb-2 uppercase">JS</button>
            </div>

            <textarea id="codeEditor" rows="8" class="w-full bg-transparent font-mono text-xs text-gray-400 outline-none resize-none no-scrollbar" placeholder="Enter code here..."></textarea>
            
            <button onclick="realDeploy()" id="deployBtn" class="w-full btn-main text-black font-bold py-4 rounded-2xl mt-4 text-sm tracking-widest">
                START DEPLOYMENT
            </button>
            <div id="urlContainer" class="hidden mt-4 p-3 bg-gold/10 border border-gold/20 rounded-xl text-center">
                <p class="text-[10px] text-gray-400 mb-1">LIVE URL:</p>
                <a id="liveLink" href="#" target="_blank" class="text-gold font-bold text-xs break-all underline"></a>
            </div>
        </div>

        <!-- Active Grid -->
        <div class="premium-card p-5 animate-fade" style="animation-delay: 0.2s;">
            <div class="flex justify-between items-center mb-6">
                <h2 class="font-bold text-sm uppercase tracking-wider">Active Threads</h2>
                <button onclick="loadProjects()" class="text-xs text-gray-500"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div id="projectList" class="space-y-3 max-h-60 overflow-y-auto no-scrollbar">
                <!-- Projects go here -->
            </div>
        </div>
    </div>

    <script>
        let codes = { html: '', css: '', js: '' };
        let activeTab = 'html';
        const editor = document.getElementById('codeEditor');

        function switchTab(t) {
            codes[activeTab] = editor.value;
            document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-'+t).classList.add('active');
            activeTab = t;
            editor.value = codes[t];
        }

        async function realDeploy() {
            const token = document.getElementById('apiToken').value;
            const name = document.getElementById('projName').value;
            codes[activeTab] = editor.value;

            if(!token || !name) return alert("Fill all fields!");

            const btn = document.getElementById('deployBtn');
            const status = document.getElementById('statusText');
            btn.disabled = true;
            btn.innerText = "UPLOADING...";
            status.innerText = "BUSY";

            // Real Vercel Deployment Logic (Minimal)
            try {
                // Combined files for instant deployment
                const combinedCode = `
                    ${codes.html}
                    <style>${codes.css}</style>
                    <script>${codes.js}<\/script>
                `;

                const res = await fetch('https://api.vercel.com/v13/deployments', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({
                        name: name,
                        files: [{ file: 'index.html', data: combinedCode }],
                        projectSettings: { framework: null }
                    })
                });

                const data = await res.json();
                if(data.url) {
                    document.getElementById('urlContainer').classList.remove('hidden');
                    document.getElementById('liveLink').href = 'https://' + data.url;
                    document.getElementById('liveLink').innerText = data.url;
                    btn.innerText = "SUCCESSFUL";
                    status.innerText = "READY";
                    setTimeout(() => { btn.innerText = "START DEPLOYMENT"; btn.disabled = false; }, 3000);
                    loadProjects();
                } else {
                    alert("Error: " + (data.error?.message || "Failed"));
                    btn.disabled = false;
                    btn.innerText = "START DEPLOYMENT";
                }
            } catch (e) { alert("Network Error"); btn.disabled = false; }
        }

        async function loadProjects() {
            const token = document.getElementById('apiToken').value;
            if(!token) return;
            const res = await fetch('https://api.vercel.com/v9/projects', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const list = document.getElementById('projectList');
            list.innerHTML = '';
            data.projects.forEach(p => {
                list.innerHTML += `
                    <div class="bg-black/40 p-3 rounded-xl flex justify-between items-center border border-gray-800">
                        <span class="text-xs font-medium">${p.name}</span>
                        <button onclick="delProject('${p.id}')" class="text-red-500 text-[10px] uppercase font-bold">Kill</button>
                    </div>
                `;
            });
        }

        async function delProject(id) {
            if(!confirm("Terminate thread?")) return;
            const token = document.getElementById('apiToken').value;
            await fetch(`https://api.vercel.com/v9/projects/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadProjects();
        }
    </script>
</body>
</html>
