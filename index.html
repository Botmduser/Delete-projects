<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FAST PREMIUM HOST | Internal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #d4af37;
            --premium-black: #050505;
            --glass: rgba(15, 15, 15, 0.85);
        }
        body {
            background-color: var(--premium-black);
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow-x: hidden;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #d4af37 0%, #f7ef8a 50%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 30px;
        }
        
        /* Floating Animation for Logo */
        .premium-logo {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Profile Icon Pulse */
        .profile-btn {
            transition: 0.3s;
            cursor: pointer;
        }
        .profile-btn:hover { transform: scale(1.1); }

        /* Loading Overlay */
        #loadingOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .upload-area {
            border: 2px dashed rgba(212, 175, 55, 0.2);
            transition: 0.3s;
        }
        .upload-area:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.05); }

        .hidden-section { display: none; }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="relative w-24 h-24 mb-6">
            <div class="absolute inset-0 border-[3px] border-gold/10 rounded-full"></div>
            <div class="absolute inset-0 border-[3px] border-t-gold rounded-full animate-spin"></div>
            <i class="fas fa-bolt absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-gold text-2xl animate-pulse"></i>
        </div>
        <p class="text-gold tracking-[6px] font-black uppercase text-[10px]">Uploading to Fast Premium Host...</p>
    </div>

    <div class="max-w-md mx-auto px-6 py-6">
        
        <div class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-3">
                <div class="premium-logo">
                    <i class="fas fa-crown text-2xl gold-gradient"></i>
                </div>
                <h1 class="text-lg font-black tracking-tighter italic uppercase">
                    𝐅𝐀𝐒𝐓 <span class="gold-gradient">𝐏𝐑𝐄𝐌𝐈𝐔𝐌</span> 𝐇𝐎𝐒𝐓
                </h1>
            </div>
            
            <div onclick="toggleLogin()" class="profile-btn flex flex-col items-end">
                <span class="text-[8px] text-gray-500 tracking-widest font-bold mb-1">LOG IN</span>
                <div class="h-10 w-10 rounded-full border border-gold/30 flex items-center justify-center bg-gray-950">
                    <i class="fas fa-user-shield text-gold text-sm"></i>
                </div>
            </div>
        </div>

        <div id="loginPrompt" class="hidden-section mb-6 animate-fade-in">
            <div class="glass-panel p-6 border-gold/40 shadow-2xl shadow-gold/10">
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-4">Set Target Identity</p>
                <input type="text" id="targetName" placeholder="Enter Project Name..." 
                    class="w-full bg-black border border-white/5 rounded-2xl px-5 py-4 text-sm outline-none focus:border-gold/50 transition mb-4">
                <button onclick="saveIdentity()" class="w-full bg-gradient-to-r from-gold to-yellow-700 text-black font-black py-4 rounded-2xl text-xs tracking-[2px]">
                    SAVE PROTOCOL
                </button>
            </div>
        </div>

        <div id="identityDisplay" class="hidden-section mb-8">
            <div class="glass-panel p-4 flex items-center gap-4 bg-gradient-to-r from-gold/5 to-transparent border-l-4 border-l-gold">
                <div class="h-10 w-10 rounded-xl bg-gold/10 flex items-center justify-center">
                    <i class="fas fa-bolt text-gold"></i>
                </div>
                <div>
                    <p class="text-[9px] text-gray-500 uppercase tracking-widest">Active Host Target</p>
                    <h2 id="activeName" class="font-bold text-white tracking-tight"></h2>
                </div>
            </div>
        </div>

        <div class="space-y-6">
            <div class="glass-panel p-8 text-center upload-area cursor-pointer" onclick="document.getElementById('fileIn').click()">
                <div class="mb-4">
                    <i class="fas fa-file-import text-4xl text-gray-700"></i>
                </div>
                <p class="text-[11px] font-bold text-gray-400 uppercase tracking-widest">Tap to Upload Ghost Files</p>
                <input type="file" id="fileIn" class="hidden" multiple onchange="processFiles()">
            </div>

            <div class="glass-panel p-6">
                <div class="flex justify-between items-center mb-5">
                    <span class="text-[10px] font-black text-gold tracking-[3px] uppercase">Nexus Core</span>
                    <div class="flex gap-1">
                        <div class="h-1.5 w-1.5 rounded-full bg-red-500"></div>
                        <div class="h-1.5 w-1.5 rounded-full bg-yellow-500"></div>
                        <div class="h-1.5 w-1.5 rounded-full bg-green-500"></div>
                    </div>
                </div>
                
                <textarea id="codeEditor" rows="6" placeholder="Paste your scripts or HTML here..." 
                    class="w-full bg-transparent font-mono text-xs text-gray-600 outline-none resize-none leading-relaxed"></textarea>
                
                <button onclick="executeFastDeploy()" class="w-full bg-white text-black font-black py-5 rounded-2xl mt-6 text-xs tracking-[4px] hover:bg-gold transition-all transform active:scale-95 shadow-xl">
                    LAUNCH DEPLOY
                </button>
            </div>
        </div>

        <p class="text-center text-[8px] text-gray-700 tracking-[8px] mt-10 uppercase">Premium Infrastructure v4.0</p>

    </div>

    <script>
        // CONFIG: Oyaage Vercel Token eka methanata danna
        const VERCEL_TOKEN = "PASTE_YOUR_VERCEL_TOKEN_HERE";

        let currentIdentity = "";
        let ghostContent = "";

        function toggleLogin() {
            const el = document.getElementById('loginPrompt');
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function saveIdentity() {
            const val = document.getElementById('targetName').value;
            if(val.length < 3) return;
            
            currentIdentity = val;
            document.getElementById('activeName').innerText = val.toUpperCase();
            document.getElementById('loginPrompt').style.display = 'none';
            document.getElementById('identityDisplay').style.display = 'block';
        }

        function processFiles() {
            const file = document.getElementById('fileIn').files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                ghostContent = e.target.result;
                const editor = document.getElementById('codeEditor');
                editor.value = "/// GHOST PROTOCOL: CONTENT ENCRYPTED ///";
                editor.classList.add('text-gold');
                editor.readOnly = true;
            };
            reader.readAsText(file);
        }

        async function executeFastDeploy() {
            if(!currentIdentity) {
                toggleLogin();
                return;
            }
            const finalData = ghostContent || document.getElementById('codeEditor').value;

            document.getElementById('loadingOverlay').style.display = 'flex';

            setTimeout(async () => {
                try {
                    const res = await fetch('https://api.vercel.com/v13/deployments', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${VERCEL_TOKEN}` },
                        body: JSON.stringify({
                            name: currentIdentity,
                            files: [{ file: 'index.html', data: finalData }],
                            projectSettings: { framework: null }
                        })
                    });

                    const data = await res.json();
                    document.getElementById('loadingOverlay').style.display = 'none';

                    if(data.url) {
                        alert("FAST PREMIUM HOST: SUCCESS!\nYour link: https://" + data.url);
                        window.open('https://' + data.url, '_blank');
                    } else {
                        alert("Deploy Error: " + data.error.message);
                    }
                } catch (e) {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    alert("System Link Failure");
                }
            }, 5000);
        }
    </script>
</body>
</html>
