<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Panel | Premium Vercel Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #050505;
            --card-bg: rgba(20, 20, 20, 0.6);
        }
        body {
            background-color: var(--dark-bg);
            color: #e0e0e0;
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            overflow-x: hidden;
        }
        .premium-glass {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .gold-glow {
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            color: var(--gold);
        }
        .gold-border-focus:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        .btn-gold {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: black;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
        }
        .status-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-3xl font-bold tracking-tighter gold-glow">GHOST<span class="text-white">PANEL</span></h1>
                <p class="text-xs text-gray-500 uppercase tracking-widest">Advanced Vercel Controller</p>
            </div>
            <div class="flex items-center gap-4">
                <input type="password" id="apiToken" placeholder="Vercel Bearer Token" 
                    class="bg-black border border-gray-800 rounded-full px-5 py-2 text-sm gold-border-focus outline-none w-48 md:w-64 transition-all">
                <button onclick="loadSystem()" class="btn-gold px-6 py-2 rounded-full text-sm">INITIALIZE</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left: Deployment Zone -->
            <div class="lg:col-span-1 space-y-6">
                <div class="premium-glass p-6">
                    <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                        <i class="fas fa-rocket gold-glow"></i> Quick Deploy
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs text-gray-500 ml-1">Project Name (min 4 chars)</label>
                            <input type="text" id="projName" placeholder="my-awesome-app" 
                                class="w-full bg-black border border-gray-800 rounded-xl px-4 py-3 mt-1 outline-none gold-border-focus">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 ml-1">HTML Content</label>
                            <textarea id="htmlCode" rows="8" placeholder="<h1>Hello World</h1>"
                                class="w-full bg-black border border-gray-800 rounded-xl px-4 py-3 mt-1 outline-none gold-border-focus font-mono text-sm"></textarea>
                        </div>
                        <button onclick="deployProject()" class="w-full btn-gold py-4 rounded-xl flex items-center justify-center gap-2">
                            <i class="fas fa-cloud-upload-alt"></i> DEPLOY GHOST
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: Project Management & Auto-Cleaner -->
            <div class="lg:col-span-2 space-y-6">
                <div class="premium-glass p-6 min-h-[500px]">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-semibold flex items-center gap-2">
                            <i class="fas fa-layer-group gold-glow"></i> Active Deployments
                        </h2>
                        <span id="projCount" class="bg-gray-800 text-gray-400 px-3 py-1 rounded-full text-xs">0 Projects</span>
                    </div>
                    
                    <div id="loader" class="hidden flex flex-col items-center justify-center py-20">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-gold mb-4"></div>
                        <p class="text-gray-500 italic">Accessing Vercel encrypted layers...</p>
                    </div>

                    <div id="projectGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Projects list will be injected here -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const getHeaders = () => {
            const token = document.getElementById('apiToken').value;
            if(!token) { alert("Please enter your Vercel Token first!"); return null; }
            return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
        };

        async function loadSystem() {
            const headers = getHeaders();
            if(!headers) return;

            const grid = document.getElementById('projectGrid');
            const loader = document.getElementById('loader');
            
            grid.innerHTML = '';
            loader.classList.remove('hidden');

            try {
                const res = await fetch('https://api.vercel.com/v9/projects', { headers });
                const data = await res.json();
                
                loader.classList.add('hidden');
                document.getElementById('projCount').innerText = `${data.projects?.length || 0} Projects`;

                data.projects.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'bg-black/40 border border-gray-800 p-4 rounded-2xl hover:border-gold/30 transition-all group';
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="font-bold text-white group-hover:text-gold transition-colors">${p.name}</h3>
                                <p class="text-[10px] text-gray-500">${new Date(p.createdAt).toLocaleString()}</p>
                            </div>
                            <span class="status-dot ${p.latestDeployments?.[0]?.readyState === 'READY' ? 'bg-green-500' : 'bg-yellow-500'}"></span>
                        </div>
                        <div class="flex gap-2 mt-4">
                            <a href="https://${p.link}" target="_blank" class="flex-1 text-center bg-gray-900 py-2 rounded-lg text-xs hover:bg-gray-800 transition-all">VIEW</a>
                            <button onclick="deleteAction('${p.id}', '${p.name}')" class="flex-1 bg-red-950/30 text-red-500 py-2 rounded-lg text-xs hover:bg-red-500 hover:text-white transition-all">TERMINATE</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) { alert("System Error: Check Token or Connection."); loader.classList.add('hidden'); }
        }

        async function deployProject() {
            const name = document.getElementById('projName').value;
            const code = document.getElementById('htmlCode').value;
            const headers = getHeaders();
            if(!name || !code || !headers) return;

            // Simplified Instant Deployment Logic
            alert("Ghost Deployment initiated for: " + name + "\n(In a full setup, this would push files via API)");
            // Note: Full deployment via API requires a multi-step fetch (files upload + deployment creation)
        }

        async function deleteAction(id, name) {
            if(!confirm(`Are you sure you want to TERMINATE ${name}?`)) return;
            const headers = getHeaders();
            const res = await fetch(`https://api.vercel.com/v9/projects/${id}`, { method: 'DELETE', headers });
            if(res.ok) { alert("Project Terminated."); loadSystem(); }
        }
    </script>
</body>
</html>
