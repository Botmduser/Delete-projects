<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vercel Project Manager | Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }
        .btn-delete {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            transition: transform 0.2s ease;
        }
        .btn-delete:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 65, 108, 0.4);
        }
        .gold-text {
            color: #d4af37;
        }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="mb-10 text-center">
            <h1 class="text-4xl font-bold gold-text">Vercel <span class="text-white">Project Manager</span></h1>
            <p class="text-gray-400 mt-2">Manage and delete your deployments with one click</p>
        </div>

        <!-- API Key Input -->
        <div class="glass-card p-6 mb-8">
            <label class="block text-sm font-medium mb-2 text-gray-300">Vercel API Token (Bearer Token)</label>
            <div class="flex gap-4">
                <input type="password" id="apiToken" placeholder="Enter your Vercel Token..." 
                    class="w-full bg-black border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-yellow-600 transition-all">
                <button onclick="fetchProjects()" 
                    class="bg-white text-black px-6 py-2 rounded-lg font-bold hover:bg-gray-200 transition-all">
                    Load Projects
                </button>
            </div>
        </div>

        <!-- Projects List -->
        <div id="loading" class="hidden text-center text-gray-400 py-10">Fetching your projects...</div>
        
        <div id="projectList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Projects will appear here -->
        </div>
    </div>

    <script>
        async function fetchProjects() {
            const token = document.getElementById('apiToken').value;
            const projectList = document.getElementById('projectList');
            const loader = document.getElementById('loading');

            if (!token) return alert("Vercel Token eka enter karanna!");

            loader.classList.remove('hidden');
            projectList.innerHTML = '';

            try {
                const response = await fetch('https://api.vercel.com/v9/projects', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                loader.classList.add('hidden');

                if (data.projects) {
                    data.projects.forEach(project => {
                        const card = document.createElement('div');
                        card.className = 'glass-card p-5 flex justify-between items-center';
                        card.innerHTML = `
                            <div>
                                <h3 class="font-bold text-lg">${project.name}</h3>
                                <p class="text-xs text-gray-500">${new Date(project.createdAt).toLocaleDateString()}</p>
                            </div>
                            <button onclick="deleteProject('${project.id}', '${project.name}')" 
                                class="btn-delete px-4 py-2 rounded-md text-sm font-semibold">
                                Delete
                            </button>
                        `;
                        projectList.appendChild(card);
                    });
                }
            } catch (error) {
                alert("Error fetching projects!");
                loader.classList.add('hidden');
            }
        }

        async function deleteProject(id, name) {
            const token = document.getElementById('apiToken').value;
            if (!confirm(`Are you sure you want to delete "${name}"?`)) return;

            try {
                const response = await fetch(`https://api.vercel.com/v9/projects/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    alert(`${name} deleted successfully!`);
                    fetchProjects(); // Refresh list
                } else {
                    alert("Delete karanna bari una. Token eka check karanna.");
                }
            } catch (error) {
                alert("Error deleting project!");
            }
        }
    </script>
</body>
</html>
