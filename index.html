<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FAST PREMIUM HOST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 25px; }
        .gold-grad { background: linear-gradient(135deg, #d4af37, #b8860b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-gold { background: linear-gradient(135deg, #d4af37, #b8860b); color: #000; font-weight: 800; transition: 0.3s; }
        .btn-gold:active { transform: scale(0.95); }
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body class="p-4">

    <div id="loader">
        <div class="w-16 h-16 border-4 border-gold/20 border-t-gold rounded-full animate-spin mb-4"></div>
        <p class="text-gold tracking-[4px] text-[10px] font-bold">UPLOADING GHOST FILES...</p>
    </div>

    <div class="max-w-md mx-auto">
        <div class="flex justify-between items-center mb-8 pt-4">
            <div class="flex items-center gap-2">
                <i class="fas fa-crown text-xl text-gold"></i>
                <h1 class="font-black text-sm tracking-tighter uppercase">𝐅𝐀𝐒𝐓 <span class="text-gold">𝐏𝐑𝐄𝐌𝐈𝐔𝐌</span> 𝐇𝐎𝐒𝐓</h1>
            </div>
            <div onclick="toggleLogin()" class="cursor-pointer flex flex-col items-end">
                <span class="text-[8px] text-gray-500 font-bold mb-1">LOG IN</span>
                <div class="h-9 w-9 rounded-full border border-gold/40 flex items-center justify-center bg-zinc-900 shadow-lg shadow-gold/10">
                    <i class="fas fa-user-shield text-gold text-xs"></i>
                </div>
            </div>
        </div>

        <div id="loginBox" class="hidden mb-6 animate-fade-in">
            <div class="glass p-6">
                <input type="text" id="targetIn" placeholder="Project Name..." class="w-full bg-black border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-gold mb-3">
                <button onclick="saveName()" class="w-full btn-gold py-3 rounded-xl text-[10px] tracking-widest uppercase">SAVE PROTOCOL</button>
            </div>
        </div>

        <div class="space-y-5">
            <div id="idBadge" class="hidden glass p-4 border-l-4 border-l-gold">
                <p class="text-[8px] text-gray-500 uppercase tracking-widest">Active Target</p>
                <h2 id="activeName" class="font-bold text-white text-sm"></h2>
            </div>

            <div class="glass p-8 text-center border-dashed border-2 border-gold/20 cursor-pointer" onclick="document.getElementById('file').click()">
                <div id="uploadStatus">
                    <i class="fas fa-cloud-upload-alt text-3xl text-zinc-700 mb-2"></i>
                    <p class="text-[10px] text-gray-500 font-bold uppercase">Tap to Upload</p>
                </div>
                <input type="file" id="file" class="hidden" onchange="fileSelected()">
            </div>

            <div class="glass p-5">
                <textarea id="editor" rows="5" placeholder="Paste Code Here..." class="w-full bg-transparent font-mono text-[10px] text-zinc-500 outline-none resize-none"></textarea>
                <button onclick="deploy()" class="w-full bg-white text-black font-black py-4 rounded-xl mt-4 text-[10px] tracking-[4px] hover:bg-gold transition-all">LAUNCH DEPLOY</button>
            </div>

            <div class="glass p-5">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-[10px] font-bold text-gold uppercase tracking-widest">Deployment Logs</h3>
                    <button onclick="loadLogs()" class="text-xs text-zinc-600"><i class="fas fa-sync-alt"></i></button>
                </div>
                <div id="logList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <p class="text-[9px] text-zinc-700 italic">No threads detected. Initialize system.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TOKEN = "PASTE_YOUR_VERCEL_TOKEN_HERE";
        let activeId = "";
        let content = "";

        function toggleLogin() {
            const box = document.getElementById('loginBox');
            box.classList.toggle('hidden');
        }

        function saveName() {
            const val = document.getElementById('targetIn').value;
            if(val) {
                activeId = val;
                document.getElementById('activeName').innerText = val.toUpperCase();
                document.getElementById('idBadge').classList.remove('hidden');
                document.getElementById('loginBox').classList.add('hidden');
            }
        }

        function fileSelected() {
            const file = document.getElementById('file').files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    content = e.target.result;
                    document.getElementById('uploadStatus').innerHTML = `
                        <i class="fas fa-check-circle text-green-500 text-3xl mb-2"></i>
                        <p class="text-[10px] text-green-500 font-black uppercase">${file.name}</p>
                        <p class="text-[8px] text-zinc-400 mt-1 uppercase">READY TO DEPLOY</p>
                    `;
                    document.getElementById('editor').value = "/// ENCRYPTED DATA STREAM ///";
                };
                reader.readAsText(file);
            }
        }

        async function deploy() {
            if(!activeId) return alert("Click Profile and set Project Name!");
            const finalCode = content || document.getElementById('editor').value;
            
            document.getElementById('loader').style.display = 'flex';

            setTimeout(async () => {
                try {
                    const res = await fetch('https://api.vercel.com/v13/deployments', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${TOKEN}` },
                        body: JSON.stringify({
                            name: activeId,
                            files: [{ file: 'index.html', data: finalCode }],
                            projectSettings: { framework: null }
                        })
                    });
                    const data = await res.json();
                    document.getElementById('loader').style.display = 'none';
                    if(data.url) {
                        alert("DEPLOY SUCCESSFUL!");
                        window.open('https://' + data.url, '_blank');
                        loadLogs();
                    } else { alert("Error: " + data.error.message); }
                } catch (e) { document.getElementById('loader').style.display = 'none'; }
            }, 5000);
        }

        async function loadLogs() {
            if(!TOKEN || TOKEN === "PASTE_YOUR_VERCEL_TOKEN_HERE") return;
            const res = await fetch('https://api.vercel.com/v9/projects', { headers: { 'Authorization': `Bearer ${TOKEN}` } });
            const data = await res.json();
            const list = document.getElementById('logList');
            list.innerHTML = '';
            data.projects.forEach(p => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-black/40 p-3 rounded-lg border border-white/5">
                        <span class="text-[10px] font-bold text-zinc-400">${p.name}</span>
                        <div class="flex gap-3">
                            <a href="https://${p.link}" target="_blank" class="text-[9px] text-gold font-bold">LIVE</a>
                            <button onclick="kill('${p.id}')" class="text-[9px] text-red-900 font-bold uppercase">Kill</button>
                        </div>
                    </div>`;
            });
        }

        async function kill(id) {
            if(confirm("Terminate Thread?")) {
                await fetch(`https://api.vercel.com/v9/projects/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${TOKEN}` } });
                loadLogs();
            }
        }
    </script>
</body>
</html>
